version: "3.9"

services:
  gpu_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-gpu-worker
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - BACKEND_URL=http://52.55.198.180:8000/api
    volumes:
      - audio_uploads:/app/media/audio_uploads
      - ./logs:/app/logs
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  audio_uploads: