name: Deploy GPU Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GPU EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GPU_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
          
            APP_DIR=/home/ubuntu/speaksense/SpeakSense/gpu_worker
            REPO_URL=https://github.com/norakeavney/SpeakSense.git
          
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repo not found. Cloning..."
              mkdir -p /home/ubuntu/speaksense
              cd /home/ubuntu/speaksense
              git clone "$REPO_URL"
            fi
          
            cd "$APP_DIR"
            git fetch origin
            git reset --hard origin/main
          
            docker compose down || true
            docker compose up -d --build
