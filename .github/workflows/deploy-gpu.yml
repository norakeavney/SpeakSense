name: Deploy GPU Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GPU EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GPU_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            BASE_DIR=/home/ubuntu/speaksense
            REPO_DIR=$BASE_DIR/SpeakSense
            APP_DIR=$REPO_DIR/gpu_worker
            REPO_URL=https://github.com/norakeavney/SpeakSense.git

            mkdir -p "$BASE_DIR"

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Repo not found or invalid. Cloning fresh..."
              rm -rf "$REPO_DIR"
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch origin
            git reset --hard origin/main

            cd "$APP_DIR"

            if [ ! -f ".env" ]; then
              echo ".env file missing in $APP_DIR"
              echo "Create the .env file on the GPU EC2 before deploying."
              exit 1
            fi

            docker compose down || true
            docker compose up -d --build
