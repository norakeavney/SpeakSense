name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
         script: |
          set -euo pipefail
        
          BASE_DIR=/home/ubuntu
          REPO_DIR=$BASE_DIR/speaksense
          REPO_URL=https://github.com/norakeavney/SpeakSense.git
        
          echo "Ensuring repo exists..."
        
          if [ ! -d "$REPO_DIR/.git" ]; then
            echo "Cloning repo..."
            rm -rf "$REPO_DIR"
            git clone "$REPO_URL" "$REPO_DIR"
          else
            echo "Repo exists. Updating..."
            cd "$REPO_DIR"
            git fetch origin
            git reset --hard origin/main
          fi
        
          cd "$REPO_DIR"
        
          echo "Detecting Docker Compose..."
        
          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          else
            echo "ERROR: Docker Compose not installed"
            exit 1
          fi
        
          echo "Deploying backend..."
        
          $COMPOSE down || true
          $COMPOSE up -d --build
